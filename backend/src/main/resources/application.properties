# Tell Hibernate to use PostGIS
quarkus.hibernate-orm.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# Disable "Dev Services" (automatic containers)
quarkus.devservices.enabled=false

# Database connection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/simulation_db


quarkus.flyway.migrate-at-start=true
# Tell Flyway to initialize the history table if the DB isn't empty
quarkus.flyway.baseline-on-migrate=true
# Ensure Hibernate waits for Flyway to finish
quarkus.hibernate-orm.database.generation=update

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
